
name: Build Steven AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'steven_android_v04.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir project
          unzip -o steven_android_v04.zip -d project

      - name: Build debug APK
        run: |
          cd project
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steven-AI-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
